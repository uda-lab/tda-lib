name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [develop, main]      # post-merge run; the develop/main rulesets does not require PR branches to be up to date
  workflow_dispatch:
    inputs:
      release_check:
        description: Run the stable-release check without generating docs
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Bound each Lean process on the hosted runner; Lake still schedules jobs.
      LEAN_NUM_THREADS: '2'
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.release_check) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Bootstrap parent mathlib cache with resource guard
        run: bash scripts/bootstrap.sh

      - name: Documentation cache compatibility
        id: docs-key
        run: echo "key=$(python3 scripts/lib/docs-cache.py key)" >> "$GITHUB_OUTPUT"

      # Clone locked sources before restoring their build subdirectories: a cache
      # must not create a nonempty package directory in place of a Git checkout.
      - name: Materialize pinned documentation dependencies
        working-directory: docbuild
        run: ../scripts/lean.sh lake env lean --version

      # One archive preserves the SQLite database, doc-data markers and traces,
      # generated HTML, TDA artifacts and the pinned generator's compiled outputs.
      # Mathlib's much larger compiled cache remains bootstrap's responsibility.
      - name: Restore API documentation cache
        id: docs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: |
            .lake/build
            docbuild/.lake
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/leansqlite/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/Cli/.lake/build
          key: tda-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.docs-key.outputs.key }}-${{ github.sha }}
          restore-keys: |
            tda-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.docs-key.outputs.key }}-

      # The cache toolkit can warn and return no key after extraction errors.
      # Only a matched key proves a complete restore; treat an empty key as cold.
      - name: Discard incomplete documentation cache restore
        if: steps.docs-cache.outcome == 'failure' || steps.docs-cache.outputs.cache-matched-key == ''
        run: |
          rm -rf .lake/build docbuild/.lake
          for pkg in doc-gen4 leansqlite UnicodeBasic BibtexQuery MD4Lean Cli; do
            rm -rf ".lake/packages/$pkg/.lake/build"
          done

      - name: Generate API documentation
        run: scripts/build-docs.sh

      - name: Measure documentation cache
        id: docs-size
        run: |
          bytes=$(du -sb .lake/build docbuild/.lake .lake/packages/{doc-gen4,leansqlite,UnicodeBasic,BibtexQuery,MD4Lean,Cli}/.lake/build | awk '{n += $1} END {print n}')
          echo "Documentation cache: $bytes bytes before compression"
          # Bound one upload below the default 10 GB repository cache quota.
          if [ "$bytes" -lt 8589934592 ]; then echo 'save=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save API documentation cache
        if: ${{ success() && steps.docs-cache.outputs.cache-hit != 'true' && steps.docs-size.outputs.save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: |
            .lake/build
            docbuild/.lake
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/leansqlite/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/Cli/.lake/build
          key: tda-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.docs-key.outputs.key }}-${{ github.sha }}

      - name: Retain private API documentation
        uses: actions/upload-artifact@v4
        with:
          name: tda-api-docs
          path: docbuild/.lake/build/doc/
          if-no-files-found: error
          retention-days: 7

  # Job name `check` is the required status-check context in the develop/main rulesets. It always
  # reports; the expensive toolchain/build/audit steps run only when build-relevant files
  # changed (same conditional pattern as scripts/hooks/pre-push).
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Draft events create a skipped check without allocating a runner. Marking the PR ready
    # triggers a fresh, real check; develop/main pushes and manual runs remain unchanged.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: |
          set -euo pipefail
          # -z: NUL-delimited raw paths (no C-style quoting of non-ASCII names); --no-renames: a
          # *.lean file renamed away must show as a deletion. The list is written to a file so the
          # regex test reads a file, not a pipe (grep -q on a pipe under pipefail can fail spuriously).
          list="$(mktemp)"; decided=false
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only -z "origin/${BASE_REF}...HEAD" | tr '\0' '\n' > "$list"; decided=true
          elif [ "$EVENT" = push ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BEFORE" HEAD | tr '\0' '\n' > "$list"; decided=true
          fi
          build=true
          if [ "$decided" = true ] \
             && ! grep -qE '\.lean$|^lakefile|^lean-toolchain$|^lake-manifest\.json$|^scripts/|^\.github/workflows/' "$list"; then
            build=false
          fi
          if [ "$BASE_REF" = main ] || [ "${GITHUB_REF_NAME:-}" = main ] || [ "$RELEASE_CHECK" = true ]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build-relevant changes: $build"; sed 's/^/  /' "$list"

      # Textual guards first: they fail in seconds, before any toolchain download.
      - name: Transient-artefact guard
        run: bash scripts/check-transient-artifacts.sh
      - name: Merge-conflict marker guard
        run: bash scripts/check-conflict-markers.sh
      - name: No unmarked sorry/admit
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: |
          if [ "$BASE_REF" = main ] || [ "$REF_NAME" = main ] || [ "$RELEASE_CHECK" = true ]; then
            bash scripts/check-no-sorry.sh --stable
          else
            bash scripts/check-no-sorry.sh
          fi
      - name: No custom axiom/opaque/unsafe
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
        run: |
          if [ "$BASE_REF" = main ] || [ "$REF_NAME" = main ] || [ "$RELEASE_CHECK" = true ]; then
            bash scripts/check-no-custom-axiom.sh --stable
          else
            bash scripts/check-no-custom-axiom.sh
          fi
      - name: Root aggregator imports-only
        run: bash scripts/check-root-aggregator.sh
      - name: Guard self-tests (lexer, Lean-build hook, codex-chain cleanup)
        run: bash scripts/test-guards.sh && bash scripts/agent/test-lean-guard.sh && bash scripts/agent/test-codex-chains.sh && bash scripts/agent/test-wrappers.sh && bash scripts/agent/test-layout.sh

      # Exposition note (opt-in lane): inactive until docs/note/note.conf exists. When it does,
      # install the TeX packages it names, build and check it, and keep the PDF as the run's
      # artifact. Unconfigured, check-note.sh prints NOT CONFIGURED and validates nothing.
      - name: Exposition note — configuration
        id: note
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/note/note.conf ]; then
            pkgs="$(sed -n 's/^[[:space:]]*TEXLIVE_PACKAGES[[:space:]]*=[[:space:]]*//p' docs/note/note.conf | tail -n 1 | sed 's/[[:space:]]*#.*$//; s/^"\(.*\)"$/\1/')"
            if [[ ! "$pkgs" =~ ^[a-z0-9.+\ -]*$ ]]; then echo "TEXLIVE_PACKAGES must be Debian package names"; exit 1; fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "packages=latexmk texlive-latex-recommended ${pkgs}" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Exposition note — install TeX
        if: steps.note.outputs.configured == 'true'
        env:
          PKGS: ${{ steps.note.outputs.packages }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PKGS
      - name: Exposition note — build and check (scripts/check-note.sh)
        run: bash scripts/check-note.sh
      - name: Exposition note — artifact
        if: steps.note.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: note
          path: docs/note/build/*.pdf
          if-no-files-found: error

      # Installs elan from lean-toolchain, fetches mathlib oleans, runs `lake build`.
      - name: Build with mathlib cache
        if: steps.changes.outputs.build == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false   # .lake of a mathlib project is multi-GB; the mathlib cache is the fast path

      - name: Bootstrap with resource guard
        if: steps.changes.outputs.build == 'true'
        run: bash scripts/bootstrap.sh

      # Reuse only this project's compiled outputs; mathlib keeps its own pinned cache.
      # A PR can read the cache seeded by its base develop branch. Lake still checks
      # source-content and dependency traces during the full build below.
      - name: Restore TDA build cache
        if: steps.changes.outputs.build == 'true'
        id: tda-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: .lake/build
          key: tda-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            tda-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json', 'lakefile.toml') }}-

      # A failed extraction must not leave partial artifacts for Lake to consume.
      - name: Discard failed TDA cache restore
        if: steps.tda-cache.outcome == 'failure'
        run: rm -rf .lake/build

      # Same gate as local: guards, no-op rebuild, live #print axioms audit.
      - name: Full gate (scripts/check.sh)
        if: steps.changes.outputs.build == 'true'
        env:
          TDA_STABLE_RELEASE: ${{ github.base_ref == 'main' || github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.release_check) }}
        run: |
          if [ "$TDA_STABLE_RELEASE" = true ]; then export TDA_STABLE_RELEASE=1; fi
          bash scripts/check.sh

      # Save only after a successful trusted develop push. PR merge-ref caches
      # cannot be reused by develop or other PRs and would consume quota.
      - name: Save TDA build cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.changes.outputs.build == 'true' && steps.tda-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: .lake/build
          key: tda-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

      - name: Build skipped (no build-relevant changes)
        if: steps.changes.outputs.build != 'true'
        run: echo "No Lean sources, build config, scripts or workflows changed; textual guards passed."
