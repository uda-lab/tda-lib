name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'docsite/**'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages-bisect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: echo "bisect variant 1: build only, no deploy job"
