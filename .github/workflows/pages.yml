name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'docsite/**'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages-bisect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "bisect variant one - build job only, no deploy job"
