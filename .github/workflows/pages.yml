name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'docsite/**'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages-bisect2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: 'echo ok'
